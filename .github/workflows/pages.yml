name: Publikacja aplikacji (GitHub Pages)

# Każda zmiana: testy logiki i test ekranowy całej aplikacji na emulatorze bazy (prawdziwe reguły z Logistyki, dane wymyślone).
# Strona publikuje się tylko z main i tylko wtedy, gdy wszystkie testy przejdą.
# Ustawienie repozytorium: Settings → Pages → Source: „GitHub Actions”.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Testy logiki
        run: npm test
      - name: Narzędzia testowe
        run: |
          npm install --no-save --no-package-lock firebase-tools@13.29.1 firebase@10.12.2 @firebase/rules-unit-testing@3.0.4 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test ekranowy
        run: |
          python3 -m http.server 8766 >/dev/null 2>&1 &
          npm run test:e2e

  publikacja:
    needs: testy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pliki strony
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icon.svg icons sw.js css js vendor www/
          # każda publikacja ma własną wersję plików (?v=…), żeby przeglądarka nie trzymała starych
          V="${GITHUB_SHA::10}"
          sed -i -E "s/\?v=[0-9A-Za-z]+/?v=$V/g" www/index.html www/js/*.js
          grep -c "?v=$V" www/index.html www/js/app.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
